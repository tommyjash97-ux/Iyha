  iyha.economy.balance:
    default: true
  iyha.economy.balance.others:
    default: true
  iyha.economy.pay:
    default: true
  iyha.economy.paytoggle:
    default: true
  iyha.economy.history:
    default: true
  iyha.leaderboard.use:
    default: true
  iyha.sell.use:
    default: true
  iyha.sell.hand:
    default: true
  iyha.sell.all:
    default: true
  iyha.sell.worth:
    default: true
  iyha.sell.history:
    default: true
  iyha.sell.multi:
    default: true
  iyha.shop.use:
    default: true
  iyha.ah.use:
    default: true
  iyha.ah.sell:
    default: true
  iyha.ah.claim:
    default: true
  iyha.orders.use:
    default: true
  iyha.orders.create:
    default: true
  iyha.enchant.use:
    default: true
  iyha.enchant.info:
    default: true
  iyha.tp.tpa:
    default: true
  iyha.tp.tpahere:
    default: true
  iyha.tp.toggle:
    default: true
  iyha.tp.home:
    default: true
  iyha.tp.home.set:
    default: true
  iyha.tp.warp:
    default: true
  iyha.tp.spawn:
    default: true
  iyha.tp.rtp:
    default: true
  iyha.combat.bounty:
    default: true
  iyha.combat.suicide:
    default: true
  iyha.ranks.view:
    default: true
  iyha.profile.view:
    default: true
  iyha.profile.stats:
    default: true
  iyha.profile.playtime:
    default: true
  iyha.profile.settings:
    default: true
  iyha.menu:
    default: true
  iyha.info:
    default: true
  iyha.social.msg:
    default: true
  iyha.social.msgtoggle:
    default: true
  iyha.social.ignore:
    default: true
  iyha.utility.nv:
    default: true
  iyha.utility.ping:
    default: true
  iyha.events.use:
    default: true
  iyha.economy.history.others:
    default: op
  iyha.profile.others:
    default: op
  iyha.admin.economy:
    default: op
  iyha.admin.economy.freeze:
    default: op
  iyha.admin.economy.audit:
    default: op
  iyha.admin.core:
    default: op
  iyha.admin.restore:
    default: op
  iyha.admin.audit:
    default: op
  iyha.admin.shop:
    default: op
  iyha.admin.ah:
    default: op
  iyha.admin.orders:
    default: op
  iyha.admin.enchant:
    default: op
  iyha.admin.items:
    default: op
  iyha.admin.events:
    default: op
  iyha.admin.spawn:
    default: op
  iyha.admin.warp:
    default: op
  iyha.bypass.cooldown:
    default: op
  iyha.bypass.combat:
    default: op
  iyha.spawn.bypass:
    default: op
  iyha.tp.unsafe:
