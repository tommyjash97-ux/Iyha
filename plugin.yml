name: IYHACore
version: '${version}'
main: net.iyha.core.IyhaCore
api-version: '26.1'
authors: [IYHA]
description: "IYHA SMP core plugin: economy, markets, enchanting, travel, PvP, ranks and events"
softdepend: [Vault, LuckPerms, PlaceholderAPI, WorldGuard, Citizens, DecentHolograms, TAB]

commands:
  balance:
    description: View a balance
    usage: "/balance [player]"
    aliases: [bal, money]
  pay:
    description: Send money
    usage: "/pay <player> <amount>"
  paytoggle:
    description: Turn incoming payments on or off
    usage: "/paytoggle"
  baltop:
    description: Richest players
    usage: "/baltop"
  eco:
    description: Economy administration
    usage: "/eco <give|take|set|reset|freeze|unfreeze|audit>"
  transactions:
    description: Recent money history
    usage: "/transactions [player]"
    aliases: [txs]
  iyha:
    description: IYHA administration
    usage: "/iyha <reload|version|modules|journal>"
  sell:
    description: Sell items to the server
    usage: "/sell [hand|all]"
  worth:
    description: Server sell prices
    usage: "/worth [hand]"
    aliases: [prices]
  sellhistory:
    description: Your recent sales
    usage: "/sellhistory"
  sellmulti:
    description: Your sell multipliers
    usage: "/sellmulti"
  shop:
    description: Open the shop
    usage: "/shop [search <text>]"
  ah:
    description: Auction House
    usage: "/ah [sell|search|selling|sold|expired|claim|cancel|player]"
    aliases: [auction, auctionhouse]
  claim:
    description: Collect pending items
    usage: "/claim"
  orders:
    description: Buy orders
    usage: "/orders [my|collect|search|create|cancel]"
    aliases: [order]
  enchants:
    description: Enchantment costs
    usage: "/enchants [name]"
  ienchant:
    description: Enchanting administration
    usage: "/ienchant <give|special|reload>"
  iitem:
    description: Custom item administration
    usage: "/iitem <give|list|info|reload>"
  tpa:
    description: Ask to teleport to a player
    usage: "/tpa <player>"
  tpahere:
    description: Ask a player to teleport to you
    usage: "/tpahere <player>"
  tpaccept:
    description: Accept a teleport request
    usage: "/tpaccept [player]"
  tpadeny:
    description: Deny a teleport request
    usage: "/tpadeny [player]"
  tpacancel:
    description: Cancel your teleport request
    usage: "/tpacancel"
  tpatoggle:
    description: Change how teleport requests are handled
    usage: "/tpatoggle"
  sethome:
    description: Set a home
    usage: "/sethome [name]"
  home:
    description: Teleport to a home
    usage: "/home [name]"
  homes:
    description: List your homes
    usage: "/homes"
  delhome:
    description: Delete a home
    usage: "/delhome <name>"
  renamehome:
    description: Rename a home
    usage: "/renamehome <old> <new>"
  warp:
    description: Teleport to a warp
    usage: "/warp [name]"
  warps:
    description: List warps
    usage: "/warps"
  setwarp:
    description: Create a warp
    usage: "/setwarp <name> [permission]"
  delwarp:
    description: Delete a warp
    usage: "/delwarp <name>"
  spawn:
    description: Teleport to spawn
    usage: "/spawn"
  setspawn:
    description: Set the spawn point
    usage: "/setspawn"
  rtp:
    description: Random teleport
    usage: "/rtp [world]"
    aliases: [wild]
  bounty:
    description: Bounties
    usage: "/bounty <add|list|info>"
  suicide:
    description: Kill yourself (confirmation needed)
    usage: "/suicide"
    aliases: [die]
  ranks:
    description: View ranks
    usage: "/ranks"
    aliases: [rank]
  profile:
    description: Player profile
    usage: "/profile [player]"
    aliases: [pv]
  stats:
    description: Player statistics
    usage: "/stats [player]"
  playtime:
    description: Playtime
    usage: "/playtime [player]"
    aliases: [pt]
  leaderboard:
    description: Leaderboards
    usage: "/leaderboard [type]"
    aliases: [lb, top, leaderboards]
  settings:
    description: Your settings
    usage: "/settings"
  msg:
    description: Private message
    usage: "/msg <player> <message>"
    aliases: [tell, w, whisper]
  reply:
    description: Reply to the last private message
    usage: "/reply <message>"
    aliases: [r]
  msgtoggle:
    description: Turn private messages on or off
    usage: "/msgtoggle"
  ignore:
    description: Ignore a player
    usage: "/ignore <player>"
  unignore:
    description: Stop ignoring a player
    usage: "/unignore <player>"
  nightvision:
    description: Toggle night vision
    usage: "/nightvision"
    aliases: [nv]
  ping:
    description: Show ping
    usage: "/ping [player]"
  menu:
    description: Main menu
    usage: "/menu"
  help:
    description: Server help
    usage: "/help"
  rules:
    description: Server rules
    usage: "/rules"
  discord:
    description: Discord link
    usage: "/discord"
  store:
    description: Store link
    usage: "/store"
  media:
    description: Media rank info
    usage: "/media"
  event:
    description: Server events
    usage: "/event [list|info|join|leave|rules]"
    aliases: [events]

