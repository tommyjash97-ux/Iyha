# IYHA custom 3x3 enchanting. The vanilla enchanting table screen is never shown.
# model B = Selection Grid: put an item in the item slot, pick enchantment tiles in the 3x3 grid, confirm.
# model A = Grid Recipe: item in the centre of the 3x3 grid, reagents in the ring, matching recipe applies.
# Both models are IYHA designs (the reference behaviour could not be verified). Change model, then /ienchant reload.
model: B
max-enchants-per-item: 5
fail-chance: 0.0        # 0 = never fails. A failure never destroys the item.
costs:
  coins-base: 400       # coins = base * level * rarity
  xp-levels-base: 2     # xp levels = ceil(base + level * 1.5)
  book-apply-fee: 250   # flat coin fee per enchantment applied from a book
rarity:
  mending: 20
  silk_touch: 8
  fortune: 4
  looting: 3
  infinity: 10
  sharpness: 1.5
  protection: 1.5
  efficiency: 1.2
  unbreaking: 1.5
  power: 1.5
  flame: 5
  thorns: 3
  frost_walker: 4
  soul_speed: 4
# Model A recipes: reagents are counted in the eight slots around the item.
recipes:
  - enchant: sharpness
    level: 1
    reagents:
      LAPIS_LAZULI: 2
      IRON_INGOT: 2
  - enchant: sharpness
    level: 2
    reagents:
      LAPIS_LAZULI: 4
      IRON_INGOT: 4
